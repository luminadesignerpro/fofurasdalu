<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin - Fofuras da Lu</title>
  <link rel="stylesheet" href="admin.css">
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Tela de Login -->
  <div class="login-container" id="loginScreen">
    <div class="login-box">
      <h1>Fofuras da Lu</h1>
      <p class="login-subtitle">Acesse o painel administrativo</p>
      <form id="loginForm">
        <div class="input-group">
          <label>Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="input-group">
          <label>Senha</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit" class="btn">Entrar</button>
      </form>
    </div>
  </div>

  <!-- Painel Admin -->
  <div id="adminPanel">
    <div class="admin-header">
      <h2>Painel Administrativo</h2>
      <button class="btn btn-sm btn-danger" onclick="logout()">Sair</button>
    </div>

    <div class="dashboard-grid">
      <!-- Formulário de Produto -->
      <div class="card">
        <h3 id="formTitle">Novo Produto</h3>
        <form id="productForm">
          <input type="hidden" id="prodId">
          <div class="input-group">
            <label>Nome do Produto</label>
            <input type="text" id="prodName" required>
          </div>
          <div class="input-group">
            <label>Preço (R$)</label>
            <input type="number" step="0.01" id="prodPrice" required>
          </div>
          <div class="input-group">
            <label>Categoria</label>
            <select id="prodCat" required>
              <option value="lacos">Laços</option>
              <option value="tiaras">Tiaras</option>
              <option value="kits">Kits</option>
            </select>
          </div>
          <div class="input-group">
            <label>Badge (Opcional - ex: Novo, Luxo, Kit)</label>
            <input type="text" id="prodBadge">
          </div>
          <div class="input-group">
            <label>Descrição</label>
            <textarea id="prodDesc" rows="3" required></textarea>
          </div>
          <div class="input-group">
            <label>Foto do Produto</label>
            <input type="file" id="prodImg" accept="image/*" class="file-upload">
            <small>Se não selecionar, a imagem antiga será mantida.</small>
          </div>
          <button type="submit" class="btn" id="saveBtn">Salvar Produto</button>
          <button type="button" class="btn btn-sm" style="margin-top: 10px; background: #999;" onclick="resetForm()">Cancelar</button>
        </form>
      </div>

      <!-- Lista de Produtos -->
      <div class="card">
        <h3>Produtos Cadastrados</h3>
        <div style="overflow-x:auto;">
          <table>
            <thead>
              <tr>
                <th>Foto</th>
                <th>Nome</th>
                <th>Preço</th>
                <th>Categoria</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="productsTableBody">
              <!-- Produtos carregados via JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div id="toastMsg">Mensagem...</div>

  <!-- Scripts -->
  <script src="supabase.js"></script>
  <script src="admin.js"></script>
</body>
</html>
